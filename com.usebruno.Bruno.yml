id: com.usebruno.Bruno
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: bruno
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=home
    # required to fix cursor scaling on wayland, especially with fractional scaling
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: git
    cleanup:
      - /share
    make-args:
      - NO_PERL=1
      - NO_TCLTK=1
      - NO_RUST=1
    make-install-args:
      - INSTALL_SYMLINKS=1
      - NO_PERL=1
      - NO_TCLTK=1
      - NO_RUST=1
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.gz
        sha256: 826817fd3671b8565586d6d49f688298de8354ab11db829c02720e5c74b9b39f
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.gz

  - name: unappimage
    buildsystem: simple
    build-options:
      cflags: "-std=gnu89"
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a

  - name: bruno
    buildsystem: simple
    sources:
      - type: script
        dest-filename: bruno
        commands:
          - zypak-wrapper.sh /app/extra/bruno/bruno --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations "$@"

      - type: extra-data
        url: https://github.com/usebruno/bruno/releases/download/v4.3.0/bruno_4.3.0_x86_64_linux.AppImage
        sha256: 3c386b1007f66d875c34a2a502063fbad65c66e37409a316ebe518788b1e80bb
        filename: bruno.appimage
        size: 174598148

      - type: file
        path: apply_extra.sh

      - type: file
        path: com.usebruno.Bruno.desktop

      - type: file
        path: com.usebruno.Bruno.metainfo.xml

      - type: file
        path: com.usebruno.Bruno.png
    build-commands:
      - install -Dm755 ./apply_extra.sh "${FLATPAK_DEST}/bin/apply_extra"
      - install -Dm755 bruno -t "${FLATPAK_DEST}/bin/"
      - install -Dm644 "${FLATPAK_ID}.desktop" -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 "${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo"
      - install -Dm644 com.usebruno.Bruno.png -t "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps"
